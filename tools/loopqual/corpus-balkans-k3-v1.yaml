# loopqual corpus balkans-k3-v1 — the Balkans control for corpus-aunz-v1
# (curvagen-valhalla#22).
#
# The same request shape as corpus-aunz-v1 (K=3, motorways allowed, the app's
# distances, c0.5 everywhere and c1.0 on two origins) on the tileset production
# serves today, so engine time, memory and served lengths on AU/NZ read as a
# ratio to the Balkans. 84 requests.
#
# Origins: corpus-v2's field cell (Vracar, 88 % of Round Trip demand is
# Belgrade), corpus-v1's Zlatibor (border-clipped mountains) and Djerdap
# (one-road gorge, the closest Balkans shape to a corridor), and two
# corpus-balkans-v1 cities, Sarajevo and Mostar (coast edge of the extract).
# Coordinates at 0.01 deg, city level.
#
# Do NOT edit this file in place: a changed corpus is a new corpus (new id).
id: corpus-balkans-k3-v1
k: 3
avoid_motorways: false
origins:
  vracar:   {lat: 44.80, lon: 20.47, terrain: "Belgrade Vracar, the field cell"}
  zlatibor: {lat: 43.73, lon: 19.70, terrain: "border-clipped mountain massif"}
  djerdap:  {lat: 44.47, lon: 22.15, terrain: "Danube gorge, one-road valleys"}
  sarajevo: {lat: 43.86, lon: 18.41, terrain: "valley ringed by mountains"}
  mostar:   {lat: 43.34, lon: 17.81, terrain: "karst at the extract's coast edge"}
cells:
  - curviness: 0.5
    origins: all
    distances_m: [50000, 100000, 200000, 300000]
    seeds: [7, 11, 23]
  - curviness: 1.0
    origins: [vracar, zlatibor]
    distances_m: [50000, 100000, 200000, 300000]
    seeds: [7, 11, 23]
way_reuse_seeds: []
