# loopqual corpus aunz-v1 — Round Trip on the AU/NZ tileset (curvagen-valhalla#22).
#
# The Launch Market's first corpus. Every earlier corpus is Serbia or the
# Balkans; nothing had been asked south of the equator. 168 requests at K=3,
# the production serve (the orchestrator's SERVE_K; Bank Fill is off), with
# the orchestrator's costing verbatim (runner.costing) and the app's defaults:
# motorways allowed, c0.5, plus c1.0 on three contrasting origins. Distances
# are the app slider's range (10-300 km): its 50 km default, 100, 200 and the
# 300 km maximum.
#
# Coordinates are CITY CENTRES at 0.01 deg — never a rider's start point.
#
# Three kinds of origin:
#   - the launch cities and the anchor: Sydney (smoke anchor, Sydney Tower),
#     Melbourne, Perth, Queenstown (NZ ride capital)
#   - the Stuart Highway corridor: Alice Springs, Tennant Creek, Katherine —
#     one sealed highway north-south and little else for 300 km
#   - shapes the Balkans corpora have no analogue for: Broome (one highway
#     along an empty coast), Hobart (an island, curvy, water-bounded), Cairns
#     (a coastal strip under a range), Wellington (sea on three sides)
#
# Do NOT edit this file in place: a changed corpus is a new corpus (new id).
id: corpus-aunz-v1
k: 3
avoid_motorways: false
origins:
  sydney:     {lat: -33.87, lon: 151.21, terrain: "launch city, the smoke anchor; Blue Mountains W, coast E"}
  melbourne:  {lat: -37.81, lon: 144.96, terrain: "launch city; bay S, ranges E, plains W"}
  perth:      {lat: -31.95, lon: 115.86, terrain: "coast half-plane, flat wheatbelt inland"}
  queenstown: {lat: -45.03, lon: 168.66, terrain: "NZ alpine lakes, few through-roads"}
  alice:      {lat: -23.70, lon: 133.88, terrain: "Stuart Hwy corridor, outback hub, ranges E-W"}
  tennant:    {lat: -19.65, lon: 134.19, terrain: "Stuart Hwy corridor, near-empty"}
  katherine:  {lat: -14.47, lon: 132.26, terrain: "Stuart Hwy corridor, Top End"}
  broome:     {lat: -17.96, lon: 122.24, terrain: "one highway along an empty coast"}
  hobart:     {lat: -42.88, lon: 147.33, terrain: "island capital, curvy, water-bounded"}
  cairns:     {lat: -16.92, lon: 145.77, terrain: "coastal strip under the tablelands range"}
  wellington: {lat: -41.29, lon: 174.78, terrain: "sea on three sides, curvy hills"}
cells:
  - curviness: 0.5 # app default
    origins: all
    distances_m: [50000, 100000, 200000, 300000]
    seeds: [7, 11, 23]
  - curviness: 1.0
    origins: [sydney, queenstown, alice]
    distances_m: [50000, 100000, 200000, 300000]
    seeds: [7, 11, 23]
way_reuse_seeds: []
