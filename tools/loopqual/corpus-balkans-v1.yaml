# loopqual corpus balkans-v1 — the non-Serbian part of the production tileset.
#
# Production serves a "Balkans" tileset (Geofabrik serbia + bosnia-herzegovina
# + montenegro, osmium-merged), but corpus-v1/v2 sample Serbia only. This
# corpus adds four non-Serbian cities so a tile A/B also reads the part of the
# graph no other corpus touches. 108 requests at K=12 (1 296 loops), rider
# mode (motorways allowed), the three rider curviness levels.
#
# Coordinates are CITY CENTRES at 0.01 deg — city level only, never a rider's
# start point. Every origin lies inside the production tileset's level-2
# coverage; the 200 km asks from Mostar and Podgorica reach the tileset edge
# (Croatian coast / Albania are not in the extract), like zlatibor/vlasina in v1.
#
# Do NOT edit this file in place: a changed corpus is a new corpus (new id).
id: corpus-balkans-v1
k: 12
avoid_motorways: false
origins:
  sarajevo:  {lat: 43.86, lon: 18.41, terrain: "BiH capital, valley ringed by mountains"}
  banjaluka: {lat: 44.77, lon: 17.19, terrain: "NW BiH, Vrbas valley / Pannonian edge"}
  mostar:    {lat: 43.34, lon: 17.81, terrain: "Herzegovina karst, near the tileset's coast edge"}
  podgorica: {lat: 42.44, lon: 19.26, terrain: "Montenegro, coastal mountains, border-clipped"}
cells:
  - curviness: 0.5
    origins: all
    distances_m: [50000, 100000, 200000]
    seeds: [7, 11, 23]
  - curviness: 0.7
    origins: all
    distances_m: [50000, 100000, 200000]
    seeds: [7, 11, 23]
  - curviness: 1.0
    origins: all
    distances_m: [50000, 100000, 200000]
    seeds: [7, 11, 23]
way_reuse_seeds: [7]
