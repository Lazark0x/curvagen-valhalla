# loopqual corpus v2 — the field-defect census corpus (curvagen-valhalla#9).
#
# Three blocks, 552 requests at K=12 (2.38x corpus-v1's 232; 6 624 loops):
#
#   C. corpus-v1 verbatim ................ 232 req  (Baseline v1 comparability)
#   A. Vracar field cell, 25-60 km ....... 100 req  (Andrey's cell; all four
#                                                    defect shapes bite here)
#   B. production demand cells ........... 220 req  (what riders actually ask for)
#
# Demand provenance: the production orchestrator's `origin_stats` demand ledger
# (`crates/cache/src/store.rs:365-380` — 0.001 deg cells, floor(deg*1000)),
# read from a one-time read-only copy of the prod cache taken 2026-09-05T21:38Z
# (163 Round Trip requests, 23 cells). Cut: cells with >= 3 requests, excluding
# two iOS-simulator-default cells (Cupertino) and two lat/lon-transposed
# pre-3.0 client cells => 8 Serbia cells carrying 144/163 = 88 % of demand.
# Reading: docs/curvagen/research/2026-09-05-prod-served-loops-reading.md.
#
# Coordinates below are CELL CENTRES (0.001 deg ~ 111 m), never a rider's
# start point — the cache copy is cell-aggregated before it reaches this file.
#
# Two demand facts corpus-v1 does not model, both encoded here:
#   1. 151 of 163 requests (93 %) ride with motorways ALLOWED
#      (`a0` in the seedless prefix, `crates/cache/src/key.rs:59-75`), while
#      corpus-v1 pins `avoid_motorways: true` everywhere. Blocks A and B run
#      rider mode (false); block C keeps v1's true, and the A4 block is the
#      A/B control at the field cell.
#   2. Riders use c0.5 (87 req), c1.0 (38), c0.7 (19), c0.65/0.75 (9 each) —
#      not v1's {0.5, 0.8}. Blocks A and B carry 0.5 / 0.7 / 1.0.
#
# Every origin verified to snap on the prod-equivalent engine
# (valhalla-curvature:prod-equivalent-b4f514d7f, /locate, motorcycle costing):
# 16 of 17 snap within 50 m; `vlasina` snaps at 750 m exactly as in v1.
#
# Do NOT edit this file in place: a changed corpus is a new corpus (new id),
# otherwise runs stop being comparable. Do not edit corpus-v1.yaml either.
id: corpus-v2
k: 12
avoid_motorways: true # v1 default; blocks A and B override per cell
origins:
  # --- corpus-v1 origins, verbatim (block C keeps Baseline v1 comparable) ---
  belgrade:  {lat: 44.7900, lon: 20.4500, terrain: "urban core"}
  novisad:   {lat: 45.2551, lon: 19.8452, terrain: "Vojvodina flat grid"}
  zlatibor:  {lat: 43.7300, lon: 19.7000, terrain: "border-clipped mountain massif (pathological)"}
  nis:       {lat: 43.3209, lon: 21.8958, terrain: "foothills"}
  djerdap:   {lat: 44.4650, lon: 22.1530, terrain: "Danube gorge, one-road valleys (spike-prone)"}
  vlasina:   {lat: 42.7130, lon: 22.3450, terrain: "SE sparse highlands, border-clipped"}
  golija:    {lat: 43.5850, lon: 20.2290, terrain: "central sparse mountains (Ivanjica)"}
  belacrkva: {lat: 44.8975, lon: 21.4172, terrain: "SE Vojvodina sparse, near RO border"}
  # --- the field cell: Belgrade Vracar (curvagen-valhalla#9) ---
  vracar:    {lat: 44.7979, lon: 20.4722, terrain: "Belgrade Vracar — the field cell"}
  # Same point, second name ON PURPOSE: `runner.py::job_filename` (:78-79)
  # keys result files by origin/distance/curviness/seed and does NOT encode
  # avoid_motorways, so the a1 control block needs its own origin name or it
  # would overwrite the a0 block's responses.
  vracar_amw: {lat: 44.7979, lon: 20.4722, terrain: "Vracar, motorways-avoided control"}
  # --- production demand cells, centre of the 0.001 deg origin_stats cell ---
  # name = d<cell_lat><cell_lon> (the ledger's integer cell), comment = demand.
  d44792_20493: {lat: 44.7925, lon: 20.4935, terrain: "demand rank 1 — 78 req (47.9 %), d30-300 km, c0.5/0.6/0.65/0.75/1.0"}
  d44796_20437: {lat: 44.7965, lon: 20.4375, terrain: "demand rank 2 — 19 req, d100 km, c0.7"}
  d44786_20448: {lat: 44.7865, lon: 20.4485, terrain: "demand rank 3 — 13 req, d50/100 km, c0.5"}
  d44794_20491: {lat: 44.7945, lon: 20.4915, terrain: "demand rank 4 — 12 req, d60/70 km, c1.0"}
  d44797_20437: {lat: 44.7975, lon: 20.4375, terrain: "demand rank 5 — 8 req, d70 km, c0.65/1.0"}
  d44812_20461: {lat: 44.8125, lon: 20.4615, terrain: "demand rank 6 — 5 req, d50/110 km, c0.5"}
  d44784_20501: {lat: 44.7845, lon: 20.5015, terrain: "demand rank 7 — 5 req, d50 km, c0.5"}
  d44800_20460: {lat: 44.8005, lon: 20.4605, terrain: "demand rank 8 — 4 req, d50 km, c0.5 (only a1 cell)"}
cells:
  # ==== BLOCK C — corpus-v1 verbatim: 232 requests ========================
  # Same origins, distances, seeds, curviness and avoid_motorways as
  # corpus-v1.yaml, so every v2 job in this block has a Baseline v1 twin.
  - curviness: 0.5 # prod default (crates/domain/src/dto_v3.rs:14-16)
    origins: [belgrade, novisad, zlatibor, nis, djerdap, vlasina, golija, belacrkva]
    distances_m: [20000, 50000, 100000, 200000, 300000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: true
  - curviness: 0.8 # v1 high-curviness subset
    origins: [belgrade, novisad, zlatibor, nis, djerdap, vlasina, golija, belacrkva]
    distances_m: [50000, 200000]
    seeds: [7, 11]
    avoid_motorways: true

  # ==== BLOCK A — Vracar field cell, 25-60 km: 100 requests ===============
  # 25/30/40/50/60 km x 5 seeds x {c0.5, c0.7, c1.0} in rider mode (motorways
  # allowed), plus one c0.5 control with motorways avoided.
  - curviness: 0.5
    origins: [vracar]
    distances_m: [25000, 30000, 40000, 50000, 60000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 0.7
    origins: [vracar]
    distances_m: [25000, 30000, 40000, 50000, 60000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 1.0
    origins: [vracar]
    distances_m: [25000, 30000, 40000, 50000, 60000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 0.5 # Road Preference control (v1 semantics) at the field cell
    origins: [vracar_amw]
    distances_m: [25000, 30000, 40000, 50000, 60000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: true

  # ==== BLOCK B — production demand cells: 220 requests ===================
  # Distances/curviness chosen to cover the observed demand mass:
  # d50 km 62 req, d100 23, d70 16, d60 15, d150 15, d300 6; c0.5 87, c1.0 38,
  # c0.7 19. All rider mode (motorways allowed), as 93 % of demand is.
  - curviness: 0.5 # the 50/100 km spine — 52 % of all requested distance
    origins: [d44792_20493, d44796_20437, d44786_20448, d44794_20491,
              d44797_20437, d44812_20461, d44784_20501, d44800_20460]
    distances_m: [50000, 100000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 1.0 # observed at 60/70 km in cells d44794_20491 / d44797_20437
    origins: [d44792_20493, d44796_20437, d44786_20448, d44794_20491,
              d44797_20437, d44812_20461, d44784_20501, d44800_20460]
    distances_m: [60000, 70000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 0.7 # the whole c0.7 mass is d100 km (cell d44796_20437, 19 req)
    origins: [d44792_20493, d44796_20437, d44786_20448, d44794_20491,
              d44797_20437, d44812_20461, d44784_20501, d44800_20460]
    distances_m: [100000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
  - curviness: 0.5 # long tail, on the two cells carrying 60 % of demand
    origins: [d44792_20493, d44796_20437]
    distances_m: [150000, 300000]
    seeds: [7, 11, 23, 42, 101]
    avoid_motorways: false
# edge_reuse_way (/trace_attributes) is computed for this stratified seed
# subset only (same seeds as corpus-v1; 300 km loops exceed the trace
# 16000-point limit and stay null there).
way_reuse_seeds: [7, 42]
