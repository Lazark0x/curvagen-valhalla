name: build-amd64

# Build the curvature fork's native-amd64 serving image and push it to GHCR for the
# Cloudflare-fronted VPS deploy (ADR-0023 / ADR-0033). Runs on a native amd64 runner so
# the Valhalla compile is fast (no QEMU). Uses Dockerfile.local (builds the checked-out
# working tree's runner stage) so the published image is exactly this branch's engine.
#
# Adding an action here needs a settings change too. This fork runs Actions under
# `allowed_actions: selected` with `github_owned_allowed: true` plus an explicit
# allow-list of `docker/setup-buildx-action@*`, `docker/login-action@*` and
# `docker/build-push-action@*` — the four actions below and nothing else. A new
# third-party action fails at startup with a policy error, not a build error;
# add its pattern under Settings -> Actions -> General first.

on:
  push:
    branches: [engine-first-phase2, curvature-costing]
  workflow_dispatch: {}

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push amd64 serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          platforms: linux/amd64
          build-args: |
            ENABLE_TESTS=Off
          push: true
          provenance: false
          # Two tags on purpose. `:amd64` is the floating tag the deploy's
          # VALHALLA_IMAGE points at (curvagen-meta/deploy/.env.production) — it
          # always means "what prod should be running". `:amd64-<sha>` is the
          # immutable one, and it is the warm-rollback target: with only the
          # floating tag, the moment a build lands the previous engine is
          # reachable by digest alone and nothing on the box records it. Roll
          # back by setting VALHALLA_IMAGE to the previous `:amd64-<sha>` and
          # `docker compose up -d valhalla` (wayfinder curvagen-valhalla#18).
          tags: |
            ghcr.io/lazark0x/valhalla-curvature:amd64
            ghcr.io/lazark0x/valhalla-curvature:amd64-${{ github.sha }}
