name: build-amd64

# Build the curvature fork's native-amd64 serving image and push it to GHCR for the
# Cloudflare-fronted VPS deploy (ADR-0023 / ADR-0033). Runs on a native amd64 runner so
# the Valhalla compile is fast (no QEMU). Uses Dockerfile.local (builds the checked-out
# working tree's runner stage) so the published image is exactly this branch's engine.

on:
  push:
    branches: [engine-first-phase2, curvature-costing]
  workflow_dispatch: {}

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push amd64 serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          platforms: linux/amd64
          build-args: |
            ENABLE_TESTS=Off
          push: true
          provenance: false
          tags: ghcr.io/lazark0x/valhalla-curvature:amd64
